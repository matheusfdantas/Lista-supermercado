<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>List Super Market</title>
</head>
<body>
    
    <div class="inicio">
        <div class="wrapper">

            
            <div class="home-screen screen active">
                <div class="topo">
                    <div class="titulo">Lista Super Mercado</div>
                    
                    <div class="menu-btn" id="btn-ir-carrinho" style="cursor: pointer;">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z"/>
                        </svg>
                    </div>
                </div>

                <div class="conteudo">
                    <div class="container">
                        <input type="text" id="input-produto" placeholder="Adicionar novo item">
                        <select id="select-categoria">
                            <option value="Hortifruti">Hortifruti</option>
                            <option value="Laticínios">Laticínios</option>
                            <option value="Padaria">Padaria</option>
                            <option value="Açougue">Açougue</option>
                            <option value="Bebidas">Bebidas</option>
                            <option value="Limpeza">Limpeza</option>
                            <option value="Outros">Outros</option>
                        </select>
                        <button id="add-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                            </svg>
                        </button>
                    </div>

                    <div class="titulo-buy">
                        <h2>Minha Lista De Compras</h2>
                    </div>

                    <div class="lista-produtos" id="lista-home"></div>
                </div>
            </div>

           
            <div class="carrinho-screen screen">
                <div class="topo">
                    <div class="back-btn" id="btn-voltar-home" style="cursor: pointer;">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:28px; height:28px;">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 15.75L3 12m0 0l3.75-3.75M3 12h18" />
                        </svg>
                    </div>
                    <div class="titulo-car">Meu Carrinho</div>
                </div>

                <div class="conteudo">
                    <div class="titulo-buy" style="margin-top: 25px;">
                        <h2>Itens no Carrinho</h2>
                    </div>
                    
                    <div class="lista-produtos" id="lista-carrinho"></div>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
